# ─── Serveur ─────────────────────────────────────────────────
spring.config.import=optional:file:.env[dotenv],optional:file:taches-service/.env[dotenv]
server.port=${SERVER_PORT:8088}
spring.application.name=taches-service

# ─── Oracle ──────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false

# ─── Keycloak ────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8080/realms/SYNAPSE/protocol/openid-connect/certs}

# ─── Feign vers projets-service ──────────────────────────────
app.services.projets-url=${PROJETS_SERVICE_URL:http://localhost:8087}

# ─── Services internes ───────────────────────────────────────
app.services.notification-url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}

# ─── CORS ────────────────────────────────────────────────────
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# ─── Kafka Producer ──────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.kafka.topic.notifications=${KAFKA_TOPIC_NOTIFICATIONS:notification-events}

# ─── Logs ────────────────────────────────────────────────────
logging.level.com.gerai.tachesservice=${LOGGING_LEVEL:DEBUG}
logging.level.org.hibernate.SQL=INFO
logging.level.root=INFO
logging.file.name=C:/gerai/logs/taches-service.log
