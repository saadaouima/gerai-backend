# ─── Serveur ─────────────────────────────────────────────────
server.port=${SERVER_PORT:8088}
spring.application.name=taches-service

# ─── Oracle ──────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:gerai_user}
spring.datasource.password=${DB_PASSWORD:gerai123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# CORRECTION : ddl-auto=update crée des tables au démarrage → Oracle rejette
# car les tables ont des contraintes CHECK complexes déjà définies par Flyway.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false

# ─── Keycloak ────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/gerai}

# ─── Feign vers projets-service ──────────────────────────────
# CORRECTION : le port de projets-service est 8087 (pas 8083)
app.services.projets-url=${PROJETS_SERVICE_URL:http://localhost:8087}

# ─── Kafka Producer ──────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
app.kafka.topic.notifications=${KAFKA_NOTIF_TOPIC:notification-events}
app.kafka.topic.partitions=1
app.kafka.topic.replicas=1

# ─── CORS ────────────────────────────────────────────────────
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# ─── Logs ────────────────────────────────────────────────────
logging.level.com.gerai.tachesservice=${LOGGING_LEVEL:INFO}
logging.level.org.hibernate.SQL=INFO