# Test profile — Oracle et Keycloak non requis
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=500
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Keycloak factice
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/realms/test/protocol/openid-connect/certs

# EmbeddedKafka : le broker embarqué remplace le broker réel
# spring.embedded.kafka.brokers est injecté automatiquement par @EmbeddedKafka
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}

# Topic utilisé par DemandeService
app.kafka.topic.notifications=notification-events
