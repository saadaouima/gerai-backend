spring.config.import=optional:file:.env[dotenv],optional:file:demandes-service/.env[dotenv]
spring.profiles.active=dev

spring.application.name=demandes-service
server.port=${SERVER_PORT:8085}

############################################
# ORACLE DATABASE CONFIGURATION
############################################
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1

############################################
# JPA / HIBERNATE
############################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

############################################
# SERVICES INTERNES
############################################
app.services.notification-url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
app.services.analytics-url=${ANALYTICS_SERVICE_URL:http://localhost:8083}

############################################
# SECURITY & CORS
############################################
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/SYNAPSE}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KC_JWK_URI:http://localhost:8080/realms/SYNAPSE/protocol/openid-connect/certs}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
app.websocket.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

############################################
# JACKSON
############################################
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

############################################
# KAFKA PRODUCER
############################################
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000

app.kafka.topic.notifications=${KAFKA_TOPIC_NOTIFICATIONS:notification-events}

############################################
# LOGGING
############################################
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG