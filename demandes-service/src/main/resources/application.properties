spring.application.name=demandes-service
server.port=${SERVER_PORT}

############################################
# ORACLE DATABASE CONFIGURATION
############################################
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

############################################
# JPA / HIBERNATE
############################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

############################################
# KAFKA CONFIGURATION
############################################
spring.kafka.bootstrap-servers=${KAFKA_SERVERS}

# Topic écouté par le service notification
app.kafka.topic.notifications=notification-events

# Configuration Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

############################################
# SECURITY & CORS
############################################
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
app.websocket.allowed-origin=${CORS_ALLOWED_ORIGIN}

############################################
# LOGGING
############################################
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG