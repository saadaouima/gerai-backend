spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    producer:
      # Serializer pour envoyer l'objet NotificationEvent en JSON
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      # Deserializer pour lire le JSON et le retransformer en objet
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: notification-group-test
      auto-offset-reset: earliest
      properties:
        # Autorise la déspérialisation des classes de ton package
        spring.json.trusted.packages: "com.gerai.notificationservice.event"