# ─── Configuration Serveur ──────────────────────────────────────────────────
spring.config.import=optional:file:.env[dotenv]
server.port=${SERVER_PORT:8084}
spring.application.name=notification-service

# ─── Configuration Oracle ──────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ─── Configuration JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Sécurité Keycloak ──────────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KC_JWK_URI:http://localhost:8080/realms/SYNAPSE/protocol/openid-connect/certs}

# ─── Configuration Async (emails) ───────────────────────────────────────────
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=email-async-

# ─── Configuration Email (SMTP) ─────────────────────────────────────────────
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USER:noreply@synapse.local}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.enabled=${MAIL_ENABLED:false}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# ─── Kafka Consumer ─────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notification-service-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.gerai.notificationservice.event.NotificationEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

app.kafka.topic.notifications=${KAFKA_TOPIC_NOTIFICATIONS:notification-events}

# ─── Logs ───────────────────────────────────────────────────────────────────
logging.level.com.gerai.notificationservice=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.mail=DEBUG
logging.level.org.hibernate.SQL=DEBUG
