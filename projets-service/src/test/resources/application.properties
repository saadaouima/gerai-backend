# ─── Serveur ─────────────────────────────────────────────────
server.port=${SERVER_PORT:8087}
spring.application.name=projets-service

# ─── Oracle (test overrides: correct user + longer timeout) ──
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=${DB_USERNAME:gerai}
spring.datasource.password=gerai123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ─── Keycloak ────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/SYNAPSE
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/SYNAPSE/protocol/openid-connect/certs

# ─── CORS ────────────────────────────────────────────────────
app.cors.allowed-origin=http://localhost:4200

# ─── Services externes ───────────────────────────────────────
app.services.notification-url=http://localhost:8084
app.services.employee-url=http://localhost:8081

# ─── Logs ────────────────────────────────────────────────────
logging.level.com.gerai.projetsservice=INFO
logging.level.org.hibernate.SQL=INFO