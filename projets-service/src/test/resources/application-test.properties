# Test profile — exécution sans Oracle ni Keycloak en ligne
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=500
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Keycloak factice (contexte démarre sans validation JWT active)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/realms/test/protocol/openid-connect/certs

# Kafka : broker injoignable mais KafkaTemplate ne connecte pas au démarrage
spring.kafka.bootstrap-servers=localhost:9092

# Topic factice requis par ProjectEventProducer (@Value)
app.kafka.topic.notifications=test-notifications
