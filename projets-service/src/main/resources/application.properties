# ─── Profil ──────────────────────────────────────────────────
spring.profiles.active=dev

# ─── Serveur ─────────────────────────────────────────────────
server.port=${SERVER_PORT:8087}
spring.application.name=projets-service

# ─── Oracle ──────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ─── Keycloak ────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/SYNAPSE}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KC_JWK_URI:http://localhost:8080/realms/SYNAPSE/protocol/openid-connect/certs}

# ─── CORS ────────────────────────────────────────────────────
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# ─── Services externes ───────────────────────────────────────
app.services.notification-url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
app.services.employee-url=${EMPLOYEE_SERVICE_URL:http://localhost:8081}

# ─── Jackson ──────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.accept-empty-string-as-null-object=true

# ─── Kafka Producer ──────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.kafka.topic.notifications=${KAFKA_TOPIC_NOTIFICATIONS:notification-events}

# ─── Groq AI ─────────────────────────────────────────────────
spring.config.import=optional:file:.env[dotenv]
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.api.base-url=https://api.groq.com/openai/v1

# ─── Uploads CV ──────────────────────────────────────────────
cv.upload-dir=${CV_UPLOAD_DIR:C:/gerai/uploads/cv}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Mail (Gmail SMTP) ───────────────────────────────────────
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
app.mail.from=${MAIL_FROM:${SMTP_USER:noreply@synapse.ma}}

# ─── Logs ────────────────────────────────────────────────────
logging.level.com.gerai.projetsservice=${LOGGING_LEVEL:INFO}
logging.level.org.hibernate.SQL=INFO