# ─── Serveur ─────────────────────────────────────────────────
server.port=${SERVER_PORT:8087}
spring.application.name=projets-service

# ─── Oracle ──────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:gerai_user}
spring.datasource.password=${DB_PASSWORD:gerai123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ─── Keycloak ────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/gerai}

# ─── CORS ────────────────────────────────────────────────────
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# ─── Kafka Producer ──────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Pas de headers de type : notification-service utilise value.default.type
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ─── Topic (même que demandes-service → zéro config supplémentaire) ──
app.kafka.topic.notifications=${KAFKA_NOTIF_TOPIC:notification-events}

# ─── Services externes ───────────────────────────────────────
app.services.employee-url=${EMPLOYEE_SERVICE_URL:http://localhost:8081}

# ─── Logs ────────────────────────────────────────────────────
logging.level.com.gerai.projetsservice=${LOGGING_LEVEL:INFO}
logging.level.org.hibernate.SQL=INFO