# ─────────────────────────────────────────────
# SERVER
# ─────────────────────────────────────────────
server.port=8086
spring.application.name=analytics-service

# ─────────────────────────────────────────────
# ORACLE DATABASE
# ─────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Dialecte spécifique
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ─────────────────────────────────────────────
# KEYCLOAK (JWT Resource Server)
# ─────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

# ─────────────────────────────────────────────
# KAFKA
# ─────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_SERVERS}
spring.kafka.consumer.group-id=analytics-group
spring.kafka.consumer.auto-offset-reset=earliest

# Désérialisation (Gestion d'erreur Json)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.gerai.analyticsservice.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.gerai.analyticsservice.event.DemandeEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.missing-topics-fatal=false
app.kafka.topic.notifications=notification-events

# ─────────────────────────────────────────────
# REDIS CACHE
# ─────────────────────────────────────────────
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.cache.redis.time-to-live=600000

# ─────────────────────────────────────────────
# JASPER REPORTS & UPLOAD
# ─────────────────────────────────────────────
app.reports.output-dir=${REPORTS_EXPORT_DIR}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}