# ─────────────────────────────────────────────
# SERVER
# ─────────────────────────────────────────────
# On utilise la variable PORT du .env, sinon 8083 par défaut
spring.config.import=optional:file:.env[dotenv]
server.port=${PORT:8083}
spring.application.name=analytics-service

# ─────────────────────────────────────────────
# ORACLE DATABASE
# ─────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Dialecte spécifique Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ─────────────────────────────────────────────
# KEYCLOAK (JWT Resource Server)
# ─────────────────────────────────────────────
# Ajout d'une valeur par défaut pour éviter l'erreur au démarrage des tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/SYNAPSE}

# ─────────────────────────────────────────────
# CACHE (Caffeine — pas de Redis requis)
# ─────────────────────────────────────────────
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# ─────────────────────────────────────────────
# JASPER REPORTS & UPLOAD
# ─────────────────────────────────────────────
app.reports.output-dir=${REPORTS_EXPORT_DIR:C:/gerai/exports/analytics}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}