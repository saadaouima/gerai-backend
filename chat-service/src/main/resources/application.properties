# ───────────────── CONFIGURATION SERVEUR ─────────────────
# Port 8086 pour éviter les conflits
spring.config.import=optional:file:.env[dotenv]
server.port=${SERVER_PORT:8086}
spring.application.name=chat-service

# ───────────────── ORACLE DATABASE ─────────────────
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ───────────────── JPA / HIBERNATE ─────────────────
# none = pas de validation/création au démarrage (évite le blocage si Oracle est arrêté)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# HikariCP : démarrer sans connexion Oracle disponible (connexion lazy au premier appel)
spring.datasource.hikari.initialization-fail-timeout=-1

# ───────────────── UPLOAD FICHIERS ─────────────────
file.upload-dir=${FILE_UPLOAD_DIR:C:/GerAI/uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ───────────────── JACKSON ─────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ───────────────── SÉCURITÉ JWT (KEYCLOAK) ─────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/SYNAPSE}

# ───────────────── KEYCLOAK ADMIN CLIENT ─────────────────
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:SYNAPSE}
keycloak.admin-username=${KEYCLOAK_ADMIN_USER}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:synapse-frontend}

# ───────────────── GROQ AI ─────────────────
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.api.base-url=https://api.groq.com/openai/v1

# ───────────────── SERVICES INTERNES ─────────────────
services.demandes.url=${DEMANDES_SERVICE_URL:http://localhost:8085}
services.employe.url=${EMPLOYE_SERVICE_URL:http://localhost:8081}

# ───────────────── LOGGING ─────────────────
logging.level.org.springframework.security=WARN
logging.level.com.gerai.chat=DEBUG