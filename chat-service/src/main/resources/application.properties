# ───────────────── CONFIGURATION SERVEUR ─────────────────
# Port 8086 pour éviter les conflits
server.port=${SERVER_PORT}
spring.application.name=chat-service

# ───────────────── ORACLE DATABASE ─────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ───────────────── JPA / HIBERNATE ─────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true

# ───────────────── UPLOAD FICHIERS ─────────────────
file.upload-dir=${FILE_UPLOAD_DIR}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ───────────────── SÉCURITÉ JWT (KEYCLOAK) ─────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

# ───────────────── KEYCLOAK ADMIN CLIENT ─────────────────
keycloak.server-url=${KEYCLOAK_SERVER_URL}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.admin-username=${KEYCLOAK_ADMIN_USER}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD}

# ───────────────── LOGGING ─────────────────
logging.level.org.springframework.security=DEBUG
logging.level.com.gerai.chat=INFO